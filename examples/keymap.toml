[mgr]
prepend_keymap = [
  { on = "l", run = "plugin zippity -- enter", desc = "Enter folder or archive; preview member" },
  { on = "L", run = "plugin zippity -- auto-preview", desc = "Toggle archive previews; forward outside archives" },
  { on = "<Right>", run = "plugin zippity -- enter", desc = "Enter folder or archive; preview member" },
  { on = "h", run = "plugin zippity -- leave", desc = "Leave folder or nested archive" },
  { on = "<Left>", run = "plugin zippity -- leave", desc = "Leave folder or nested archive" },
  { on = "<A-a>", run = "plugin zippity -- menu", desc = "Archive actions" },
  { on = "<A-f>", run = "plugin zippity -- search", desc = "Search archive member paths" },
  { on = "<A-t>", run = "plugin zippity -- check", desc = "Verify archive integrity" },
  { on = "<A-e>", run = "plugin zippity -- edit", desc = "Begin archive edit session" },
  { on = "<A-s>", run = "plugin zippity -- save", desc = "Save archive changes" },
  { on = "<A-d>", run = "plugin zippity -- discard", desc = "Discard archive changes" },
  { on = "<A-n>", run = "plugin zippity -- create", desc = "Create archive from selection" },
  { on = "<A-z>", run = "plugin zippity -- quick", desc = "Quick compress with the last settings" },
  { on = "<A-x>", run = "plugin zippity -- extract", desc = "Extract whole archives beside them" },
  { on = "<A-p>", run = "plugin zippity -- preview", desc = "Preview archive member" },
  { on = "<A-u>", run = "plugin zippity -- unlock", desc = "Set archive password" },
  { on = "<A-l>", run = "plugin zippity -- lock", desc = "Forget password and remove member cache" },
  { on = "p", run = "plugin zippity -- paste", desc = "Paste files or extract archive members" },
  { on = "P", run = "plugin zippity -- paste-force", desc = "Paste or extract with overwrite" },
  { on = "x", run = "plugin zippity -- cut", desc = "Cut outside archives" },
  { on = "q", run = "plugin zippity -- quit", desc = "Clean member caches and quit" },
  { on = "Q", run = "plugin zippity -- quit-no-cwd", desc = "Clean member caches and quit without changing directory" },
]
