[package]
name = "zippity"
version = "0.0.5"
edition = "2024"
license = "MIT"
description = "Archive browsing and transactional management for Yazi"
repository = "https://github.com/hawkff/zippity"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rustix = { version = "1.1.5", features = ["event", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4.5"
tempfile = "3"
